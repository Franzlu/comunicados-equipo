name: Enviar recordatorios

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Enviar comunicados y recordatorios
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://franzlu.github.io/comunicados-equipo/
        run: node enviar-recordatorios.js

      - name: Mantener activa la tarea
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u > .github/ultima-actividad.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/ultima-actividad.txt
            git commit -m "Mantener activa la tarea de recordatorios"
            git push
          fi
