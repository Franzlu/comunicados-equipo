name: Enviar recordatorios

on:
  schedule:
    - cron: "*/5 * * * *"    # cada 5 minutos
  workflow_dispatch:         # botón "Run workflow" para probar a mano

permissions:
  contents: write

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Enviar comunicados y recordatorios
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://franzlu.github.io/comunicados-equipo/
        run: node enviar-recordatorios.js

      # GitHub pausa las tareas programadas si el repositorio pasa 60 días sin cambios.
      # Este paso hace un cambio mínimo cada ~45 días para que nunca se detenga.
      - name: Mantener activa la tarea
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            date -u > .github/ultima-actividad.txt
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .github/ultima-actividad.txt
            git commit -m "Mantener activa la tarea de recordatorios"
            git push
          fi
